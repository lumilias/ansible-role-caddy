---

- name: install build dependencies for xcaddy
  ansible.builtin.package:
    name: "{{ caddy_build_dependencies[ansible_os_family] | default(caddy_build_dependencies['Default']) }}"
    state: present
    update_cache: true

- name: Install geoipupdate DEB directly from GitHub
  ansible.builtin.apt:
    deb: "https://github.com/maxmind/geoipupdate/releases/download/v{{ geoip_version }}/geoipupdate_{{ geoip_version }}_linux_{{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}.deb"
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Install geoipupdate RPM directly from GitHub
  ansible.builtin.yum:
    name: "https://github.com/maxmind/geoipupdate/releases/download/v{{ geoip_version }}/geoipupdate_{{ geoip_version }}_linux_{{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}.rpm"
    state: present
    disable_gpg_check: true
  when: ansible_os_family == 'RedHat'

- name: Deploy GeoIP configuration file
  ansible.builtin.copy:
    dest: /etc/GeoIP.conf
    owner: root
    group: root
    mode: '0640'
    content: |
      AccountID {{ maxmind_account_id }}
      LicenseKey {{ maxmind_license_key }}
      EditionIDs {{ maxmind_edition_ids }}

- name: Run initial geoipupdate to download databases
  ansible.builtin.command:
    cmd: /usr/bin/geoipupdate
  register: geoip_result
  changed_when: "'Up to date' not in geoip_result.stdout"

- name: Schedule weekly GeoIP database updates
  ansible.builtin.cron:
    name: "Weekly MaxMind GeoIP Update"
    minute: "0"
    hour: "3"
    weekday: "1"
    job: "/usr/bin/geoipupdate"

- name: install xcaddy
  ansible.builtin.command:
    cmd: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
    creates: "{{ lookup('env', 'HOME') }}/go/bin/xcaddy"
  environment:
    PATH: "{{ ansible_env.PATH }}:/usr/local/go/bin:{{ lookup('env', 'HOME') }}/go/bin"
    GOPATH: "{{ lookup('env', 'HOME') }}/go"

- name: check installed caddy modules
  ansible.builtin.command:
    cmd: "{{ caddy_binary_path }} list-modules"
  register: caddy_modules
  changed_when: false
  failed_when: false

- name: identify missing caddy modules
  ansible.builtin.set_fact:
    caddy_missing_modules: "{{ caddy_required_plugins | map(attribute='module') | difference(caddy_modules.stdout_lines | default([])) }}"

- name: build caddy with required plugins
  ansible.builtin.command:
    cmd: >-
      {{ lookup('env', 'HOME') }}/go/bin/xcaddy build
      --output {{ caddy_binary_path }}
      --with {{ caddy_required_plugins | map(attribute='package') | join(' --with ') }}
  when: caddy_modules.rc != 0 or caddy_missing_modules | length > 0
  notify: restart caddy
  environment:
    PATH: "{{ ansible_env.PATH }}:/usr/local/go/bin:{{ lookup('env', 'HOME') }}/go/bin"
    GOPATH: "{{ lookup('env', 'HOME') }}/go"

- name: ensure caddy binary is executable
  ansible.builtin.file:
    path: "{{ caddy_binary_path }}"
    mode: '0755'
    owner: root
    group: root

- name: restore SELinux context on caddy binary
  ansible.builtin.command:
    cmd: restorecon -v "{{ caddy_binary_path }}"
  when: ansible_selinux.status | default(false) and ansible_selinux.mode | default('') != 'disabled'
  changed_when: true

- name: Ensure caddy group exists
  ansible.builtin.group:
    name: "{{ caddy_group }}"
    system: true

- name: Add the caddy user
  ansible.builtin.user:
    name: "{{ caddy_user }}"
    group: "{{ caddy_group }}"

- name: install caddy systemd service
  template:
    src: caddy.service.j2
    dest: /etc/systemd/system/caddy.service
    owner: root
    group: root
    mode: 0644

- name: create caddy log directory
  file:
    path: "{{ caddy_log_path }}"
    state: directory
    owner: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    mode: 0755

- name: touch caddy.log
  ansible.builtin.file:
    path: "{{ caddy_log_path }}/caddy.log"
    state: touch
    owner: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    mode: 0755

- name: restart caddy service
  ansible.builtin.systemd:
    name: caddy
    daemon_reload: true
    enabled: yes